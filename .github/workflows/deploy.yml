name: Sync to Hugging Face Spaces

on:
  push:
    branches: [huggingface]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          SPACE_NAME: "Compiler"
        run: |
          git config --global user.email "lmtcv1.9@gmail.com"
          git config --global user.name "hn"
          git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME

          # Retry tối đa 5 lần, mỗi lần chờ lâu hơn (30s, 60s, 120s, 240s)
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            git push --force hf huggingface:main && echo "Push succeeded!" && exit 0
            if [ $i -lt 5 ]; then
              WAIT=$((30 * (2 ** (i - 1))))
              echo "Failed (429?). Waiting ${WAIT}s before retry..."
              sleep $WAIT
            fi
          done

          echo "All attempts failed."
          exit 1
